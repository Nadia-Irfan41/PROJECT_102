<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Intake Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <div class="hero-content">
      <img src="assets/water-logo.png" alt="Water Intake Tracker logo" class="logo">
      <h1>Water Intake Tracker</h1>
      <h2>Stay Hydrated, Stay Healthy</h2>
      <p>Track your daily water intake, set your hydration goals, and build better habits for a healthier you.</p>
      <div class="buttons">
        <button id="getStartedBtn" class="btn btn-primary">Get Started</button>
        <div class="btn-row">
          <button id="loginBtn" class="btn btn-secondary">Login</button>
          <button id="registerBtn" class="btn btn-secondary">Register</button>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
