<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Water Intake Tracker</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="forgot-password.css">
  <script src="icons.js"></script>
</head>
<body>
  <main class="page">
    <section class="left">
      <img src="assets/water-logo.png" alt="Water Intake Tracker logo" class="logo">
      <h1>Water Intake Tracker</h1>
      <p>Forgot your password?<br>No worries, we'll help you get back on track.</p>
    </section>

    <section class="card">
      <div class="card-top">
        <a href="login.html" class="back" aria-label="Back to login">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <h2 id="title">Forgot Password</h2>
        <span class="card-top-spacer" aria-hidden="true"></span>
      </div>

      <!-- Step 1: email -->
      <form id="emailForm" novalidate>
        <p class="fp-note">Enter your registered email address to reset your password.</p>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your registered email" autocomplete="email">
        <span class="error" id="emailError"></span>
        <button type="submit" class="submit" id="emailBtn">Continue</button>
        <p class="login-text">Remembered it? <a href="login.html">Back to Login</a></p>
      </form>

      <!-- Step 2: new password -->
      <form id="resetForm" novalidate hidden>
        <p class="fp-note" id="forEmail"></p>
        <label for="newPassword">New Password</label>
        <div class="password-box">
          <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
          <button type="button" class="eye" data-target="newPassword" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.7 9.7 0 0 1 12 4c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M2 2l20 20"/></svg>
          </button>
        </div>
        <span class="error" id="newError"></span>
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-box">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
          <button type="button" class="eye" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.7 9.7 0 0 1 12 4c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M2 2l20 20"/></svg>
          </button>
        </div>
        <span class="error" id="confirmError"></span>
        <button type="submit" class="submit" id="resetBtn">Reset Password</button>
      </form>

      <!-- Step 3: success -->
      <div id="doneBox" class="fp-done" hidden>
        <div class="fp-check"><span class="ic" data-i="check"></span></div>
        <p class="success">Password reset successful!</p>
        <p class="fp-note">You can now log in with your new password.</p>
        <a href="login.html" class="submit fp-login">Back to Login</a>
      </div>
      <p class="success" id="msg" role="alert" style="color:#e53935"></p>
    </section>
  </main>
  <script src="forgot-password.js"></script>
</body>
</html>
